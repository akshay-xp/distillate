name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      # npm >= 11.5.1 is required for Trusted Publishing (OIDC) + automatic
      # provenance. Held on the 11 line because npm 12 wraps `npm info --json`
      # in an array; @changesets/cli 3.0.0 unwraps that on its npm code path but
      # not the pnpm one this repo takes, so publish dies reading `.versions`.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      # Release gates on the published library. Build first so its dist exists,
      # then test it; the private apps/bench (which pulls external packages and
      # imports distillate's built subpaths) is not part of the release gate.
      - run: pnpm build
      - run: pnpm --filter distillate test
      - uses: changesets/action@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          version-script: pnpm run version
          publish-script: pnpm run release
          # Conventional-commit message so the local commitlint hook accepts
          # the bot's version commit.
          commit-message: "chore: version packages"
          # v2 no longer falls back to the checkout credentials or GITHUB_TOKEN
          # env for pushing the version commit/tag; the token must be an input.
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

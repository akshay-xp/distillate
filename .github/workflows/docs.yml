name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site imports `distillate` through its exports map, which resolves
      # to `dist/`, so the library has to exist before the site can build.
      - run: pnpm --filter distillate build
      - run: pnpm --filter distillate-docs build
      # Runs against the build above rather than the deployed site, so a dead
      # link fails the pull request that introduces it.
      - run: pnpm --filter distillate-docs links:check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-dist
          path: apps/docs/dist/

  # Deploys exactly what the build job link-checked, rather than rebuilding, so
  # what goes live is the artifact that passed. Gated on a push to main: a pull
  # request must not be able to publish to the live site.
  deploy:
    name: deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # No checkout on purpose. Nothing here needs the repository, only the
      # artifact, and checking it out would put pnpm-lock.yaml in the workspace,
      # which makes wrangler-action infer pnpm and install with a package
      # manager this job does not set up.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-dist
          path: apps/docs/dist/
      - uses: cloudflare/wrangler-action@4e88846969242f7752bcfdaf5511bfbb3985ca47 # v4.1.1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Stated rather than inferred from a lockfile, so the step does not
          # change behaviour if the workspace contents ever change.
          packageManager: npm
          # Pinned for the same reason the action SHAs are: this runs with a
          # token that can publish the site, so it must not float.
          wranglerVersion: "4.125.0"
          command: pages deploy apps/docs/dist --project-name=distillate-docs --branch=main
